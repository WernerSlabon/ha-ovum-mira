name: Zip Release

on:
  release:
    types:
      - published

jobs:
  release:
    name: Release Ovum Mira
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Check out the code
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v4

      # Step 2: Update version in manifest.json to match the release tag
      - name: 🔢 Adjust version number
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version,,}"            # convert to lowercase (e.g., V2024.10.1 -> v2024.10.1)
          version="${version#v}"            # remove leading 'v' if present
          manifest="${{ github.workspace }}/custom_components/ovum_mira/manifest.json"
          jq --arg v "$version" '.version = $v' "$manifest" > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"

      # Step 3: Create a ZIP archive of the component directory
      - name: 📦 Create zipped release package
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/ovum_mira"
          zip ovum_mira.zip -r ./

      # Step 4: Upload ZIP as a release asset (for HACS)
      - name: ⬆️ Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/custom_components/ovum_mira/ovum_mira.zip
