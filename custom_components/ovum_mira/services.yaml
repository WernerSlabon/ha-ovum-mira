# Services for Ovum Mira Integration

write_register:
  name: Write Register
  description: Schreibt einen Wert direkt in ein Modbus-Register (für fortgeschrittene Benutzer)
  fields:
    address:
      name: Register-Adresse
      description: Die Modbus-Register-Adresse
      required: true
      example: 55001
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    value:
      name: Wert
      description: Der zu schreibende Wert
      required: true
      example: 50
      selector:
        number:
          min: -32768
          max: 65535
          mode: box
    slave:
      name: Slave ID
      description: Die Modbus Slave ID (Standard 110 für HSM)
      required: false
      default: 110
      example: 110
      selector:
        number:
          min: 1
          max: 247
          mode: box
